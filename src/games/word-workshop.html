/* Layout: one-screen beach scene — sky + sun up top holding the crossword, sand below holding the shell wheel.
   Sketchpad look: graphite on cream paper; coloured pencil only for the orange trace line, gold (points / hints / bonus) and green (good word). */
:root{
  --paper:#f6f3ea; --paper-2:#efeadd; --ink:#2e2e33; --pencil:#55555c; --muted:#7a7a80; --faint:#c9c6bc;
  --yellow:#c99a1a; --yellow-wash:#f3e6b0; --orange:#d9661a; --orange-wash:#f0c9a8; --blue:#2f6fb5; --blue-wash:#d6e4f2;
  --green:#5a9a6a; --green-wash:#dcebdd; --purple:#6f4a9a; --purple-wash:#e6dcef; --pink:#c45a8a; --pink-wash:#f0d5e2;
  --display:"Gloria Hallelujah","Comic Sans MS","Chalkboard SE",cursive;
  --body:"Patrick Hand","Comic Sans MS","Chalkboard SE",cursive;
  --wob:255px 15px 225px 15px/15px 225px 15px 255px;
  --wob2:15px 255px 15px 225px/225px 15px 255px 15px;
  --halo:0 0 6px var(--paper),0 0 12px var(--paper),2px 2px 0 var(--paper);
  color-scheme:light;
}

.brand{margin:0;min-width:0;font-family:var(--display);font-weight:400;font-size:clamp(1.05rem,6.2vw,1.6rem);line-height:1.15;color:var(--ink);text-transform:uppercase;letter-spacing:.04em;
  transform:rotate(-1.5deg);transform-origin:left center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand small{display:block;font-family:var(--body);font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.pill{display:flex;align-items:center;gap:6px;background:var(--paper);border:2px solid var(--ink);border-radius:var(--wob);padding:3px 12px 3px 6px;
  font-family:var(--display);font-weight:400;font-variant-numeric:tabular-nums;box-shadow:2px 2px 0 var(--pencil)}
.pill+.pill{border-radius:var(--wob2)}
.coin{width:20px;height:20px;border-radius:50%;background:var(--yellow-wash);border:1.5px solid var(--yellow);box-sizing:border-box;display:inline-block;
  background-image:repeating-linear-gradient(135deg,transparent 0 3px,rgba(201,154,26,.55) 3px 4px)}
.board-wrap{position:relative;z-index:2;flex:1 1 57%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding-block:4px;padding-inline:8px;min-height:0}

.cell.hint{color:var(--orange);background:var(--yellow-wash);box-shadow:inset 0 0 0 1.5px var(--yellow)}
.cell.pop{animation:pop .35s ease}
.cell.glow{color:var(--orange);animation:glow 1.4s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:inset 0 0 0 2px var(--yellow),0 0 0 2px rgba(201,154,26,.35)}50%{box-shadow:inset 0 0 0 2px var(--yellow),0 0 0 5px rgba(201,154,26,.6)}}
.hud{display:flex;align-items:center;gap:8px}
.mute{width:36px;height:36px;border-radius:50%;border:2px solid var(--ink);cursor:pointer;background:var(--paper);color:#2e2e33;display:flex;align-items:center;justify-content:center;box-shadow:2px 2px 0 var(--pencil)}
.mute svg{width:20px;height:20px}
.mute:focus-visible{outline:2px dashed var(--ink);outline-offset:2px}
@keyframes pop{0%{transform:scale(.6)}45%{transform:scale(1.22)}70%{transform:scale(.94)}100%{transform:scale(1)}}
.letter.bounce{animation:shellBounce .32s ease-out}
@keyframes shellBounce{0%{transform:translate(-50%,-50%) scale(1)}40%{transform:translate(-50%,-50%) scale(1.28)}70%{transform:translate(-50%,-50%) scale(1.04)}100%{transform:translate(-50%,-50%) scale(1.1)}}
#wheel.shake{animation:wheelShake .4s ease}
@keyframes wheelShake{20%{transform:translateX(-9px) rotate(-3deg)}40%{transform:translateX(8px) rotate(2deg)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
#board.bump{animation:bump .45s ease}
@keyframes bump{30%{transform:scale(1.03)}60%{transform:scale(.99)}}
.level-tag{position:relative;text-align:center;background:var(--paper);border:2px solid var(--ink);padding:2px 12px 1px;border-radius:var(--wob2);font-weight:400;font-size:.95rem;color:var(--ink);letter-spacing:.06em;text-transform:uppercase;box-shadow:2px 2px 0 var(--pencil)}
.lower{position:relative;z-index:2;flex:1 1 43%;display:flex;flex-direction:column;align-items:center;padding:6px 16px 14px;min-height:0}
#preview{height:44px;min-width:60px;display:flex;align-items:center;justify-content:center;margin:4px 0 2px;box-sizing:border-box;
  font-family:var(--display);font-weight:400;font-size:1.6rem;letter-spacing:.08em;color:var(--ink);padding-top:.15em;
  background:var(--paper);border:2px solid var(--ink);border-radius:var(--wob);padding-inline:16px;box-shadow:3px 3px 0 var(--pencil);transition:opacity .15s}
#preview.empty{opacity:0}
#bonusList{width:100%;max-width:420px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:5px;max-height:52px;overflow-y:auto;padding-block:2px;margin-top:2px}
#bonusList .bl-title{font-weight:400;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);background:var(--paper);border:1.5px solid var(--ink);border-radius:var(--wob);padding:2px 9px;font-variant-numeric:tabular-nums}
#bonusList .chip{font-family:var(--display);font-weight:400;font-size:.8rem;letter-spacing:.06em;line-height:1;padding:5px 8px 2px;border-radius:var(--wob2);background:var(--paper);border:1.5px solid var(--ink);color:var(--ink);box-shadow:1px 1px 0 var(--pencil)}
#bonusList .chip.blank{font-family:var(--body);font-size:.9rem;letter-spacing:0;background:var(--paper);border:1.5px dashed var(--faint);color:var(--muted);box-shadow:none;padding:3px 8px}
#bonusList .chip.new{animation:pop .45s ease}
#preview.bad{animation:shake .35s;text-decoration:line-through;text-decoration-color:var(--orange);text-decoration-thickness:2px}
#preview.good{background:var(--green-wash);border-color:var(--green);color:var(--ink);box-shadow:3px 3px 0 var(--green)}
#preview.bonus{background:var(--yellow-wash);color:var(--ink);border-color:var(--yellow);box-shadow:3px 3px 0 var(--yellow)}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.wheel-row{flex:1;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;min-height:0}
#wheel{position:relative;flex:0 0 auto;border-radius:50%;touch-action:none;background:var(--paper);border:2px solid var(--ink);box-sizing:border-box;
  background-image:repeating-linear-gradient(135deg,transparent 0 9px,rgba(85,85,92,.12) 9px 10px);
  box-shadow:0 0 0 5px var(--paper),0 0 0 6.5px var(--pencil),5px 6px 0 6px rgba(46,46,51,.2)}
#wheel::before{content:"";position:absolute;left:14%;top:7%;width:46%;height:30%;border-radius:50%;pointer-events:none;border-top:2px solid rgba(85,85,92,.45);transform:rotate(-24deg)}
#wheel svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

function canBuild(w,letters){const a=letters.split('');for(const ch of w){const i=a.indexOf(ch);if(i<0)return false;a.splice(i,1)}return true}

// ---------- crossword layout ----------
function seeded(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
// Tries several word orders (seeded, so the same level always gets the same grid) and keeps the fullest one.
function layout(words,maxWords,maxDim=9,tries=1){
  const base=[...words].sort((a,b)=>b.length-a.length);
  let best=layoutOnce(base,maxWords,maxDim);
  for(let t=1;t<tries&&best.words.length<Math.min(maxWords,words.length);t++){
    const r=seeded(t*7919+words.length),rest=base.slice(1).map(w=>[w,w.length+r()*2.5]).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
    const g=layoutOnce([base[0],...rest],maxWords,maxDim);
    if(g.words.length>best.words.length||(g.words.length===best.words.length&&g.rows*g.cols<best.rows*best.cols))best=g;
  }
  return best;
}
function layoutOnce(sorted,maxWords,maxDim){
  const cells=new Map(); // key -> {ch, dirs:Set}
  const K=(r,c)=>r+','+c;
  const placed=[];
  function fits(w,r,c,d){
    const dr=d==='V'?1:0, dc=d==='H'?1:0;
    const before=K(r-dr,c-dc), after=K(r+dr*w.length,c+dc*w.length);
    if(cells.has(before)||cells.has(after))return -1;
    let inter=0;
    for(let i=0;i<w.length;i++){
      const rr=r+dr*i, cc=c+dc*i, cell=cells.get(K(rr,cc));
      if(cell){ if(cell.ch!==w[i]||cell.dirs.has(d))return -1; inter++; }
      else{
        const n1=K(rr+dc,cc+dr), n2=K(rr-dc,cc-dr);
        if(cells.has(n1)||cells.has(n2))return -1;
      }
    }
    return inter;
  }
  function put(w,r,c,d){
    const dr=d==='V'?1:0, dc=d==='H'?1:0;
    for(let i=0;i<w.length;i++){const k=K(r+dr*i,c+dc*i);if(!cells.has(k))cells.set(k,{ch:w[i],dirs:new Set()});cells.get(k).dirs.add(d)}
    placed.push({w,r,c,d});
  }
  function bbox(extra){let r0=1e9,r1=-1e9,c0=1e9,c1=-1e9;for(const k of cells.keys()){const[r,c]=k.split(',').map(Number);r0=Math.min(r0,r);r1=Math.max(r1,r);c0=Math.min(c0,c);c1=Math.max(c1,c)}
    if(extra){const{w,r,c,d}=extra;const r2=d==='V'?r+w.length-1:r,c2=d==='H'?c+w.length-1:c;r0=Math.min(r0,r);c0=Math.min(c0,c);r1=Math.max(r1,r2);c1=Math.max(c1,c2)}
    return{r0,r1,c0,c1,h:r1-r0+1,w:c1-c0+1}}
  put(sorted[0],0,0,'H');
  const bonus=[];
  for(const w of sorted.slice(1)){
    if(placed.length>=maxWords){bonus.push(w);continue}
    let best=null;
    for(const [k,cell] of cells){
      const[r,c]=k.split(',').map(Number);
      for(let i=0;i<w.length;i++){ if(w[i]!==cell.ch)continue;
        for(const d of ['H','V']){
          const sr=d==='V'?r-i:r, sc=d==='H'?c-i:c;
          const inter=fits(w,sr,sc,d); if(inter<1)continue;
          const b=bbox({w,r:sr,c:sc,d});
          if(Math.max(b.h,b.w)>maxDim)continue;
          const score=inter*100-(b.h*b.w)-Math.abs(b.h-b.w)*3;
          if(!best||score>best.score)best={r:sr,c:sc,d,score};
        }}
    }
    if(best)put(w,best.r,best.c,best.d); else bonus.push(w);
  }
  const b=bbox();
  return{rows:b.h,cols:b.w,words:placed.map(p=>({...p,r:p.r-b.r0,c:p.c-b.c0})),bonus};
}

let mode=MODES[store.get('mode','beg')]||MODES.beg,LV=mode.levels,HINT_COST=mode.hint;

function startLevel(i,restore){

  const sv=restore&&store.get(progKey(null,'lvl'),null);

    sv.bonus.forEach(w=>bonusFound.add(w));(sv.revealed||[]).forEach(k=>revealed.add(k));(sv.glow||[]).forEach(k=>glow.add(k));

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

  const gap=3;
  cellSize=Math.floor(Math.min((wrap.width-16-52-gap*(grid.cols-1))/grid.cols,(wrap.height-12-52-30-gap*(grid.rows-1))/grid.rows,66));
  boardEl.style.width=(grid.cols*(cellSize+gap)-gap)+'px';
  boardEl.style.height=(grid.rows*(cellSize+gap)-gap)+'px';
  boardEl.innerHTML='';
  const seen=new Set();
  grid.words.forEach(p=>{for(let i=0;i<p.w.length;i++){
    const r=p.d==='V'?p.r+i:p.r,c=p.d==='H'?p.c+i:p.c,k=r+','+c;
    if(seen.has(k))continue;seen.add(k);
    const el=document.createElement('div');el.className='cell';el.dataset.k=k;
    el.style.cssText=`left:${c*(cellSize+gap)}px;top:${r*(cellSize+gap)}px;width:${cellSize}px;height:${cellSize}px;font-size:${cellSize*.58}px`;
    boardEl.appendChild(el);
  }});
  refreshCells(false);
}
function cellsOf(p){const out=[];for(let i=0;i<p.w.length;i++){out.push({k:(p.d==='V'?p.r+i:p.r)+','+(p.d==='H'?p.c+i:p.c),ch:p.w[i]})}return out}
function refreshCells(animateWord){
  const shown=new Map();
  grid.words.forEach(p=>{if(found.has(p.w))cellsOf(p).forEach(x=>shown.set(x.k,{ch:x.ch,hint:false}))});
  grid.words.forEach(p=>cellsOf(p).forEach(x=>{if(revealed.has(x.k)&&!shown.has(x.k))shown.set(x.k,{ch:x.ch,hint:true})}));
  const animKeys=new Map();if(animateWord)cellsOf(animateWord).forEach((x,i)=>animKeys.set(x.k,i));
  boardEl.querySelectorAll('.cell').forEach(el=>{
    const s=shown.get(el.dataset.k);
    el.textContent=s?s.ch:''; el.classList.toggle('filled',!!s); el.classList.toggle('hint',!!(s&&s.hint));el.classList.toggle('glow',!!(s&&s.hint&&glow.has(el.dataset.k)));
    if(animKeys.has(el.dataset.k)){const i=animKeys.get(el.dataset.k);el.classList.remove('pop');void el.offsetWidth;el.style.animationDelay=(i*70)+'ms';el.classList.add('pop');Sound.plink(i,i*.07)}
  });
}

let letterEls=[],centers=[],wheelSize=200;
function renderWheel(){
  const row=wheel.parentElement.getBoundingClientRect();
  wheelSize=Math.max(170,Math.min(row.width-140,row.height-8,300));
  wheel.style.width=wheel.style.height=wheelSize+'px';
  wheel.querySelectorAll('.letter').forEach(e=>e.remove());
  const n=order.length,R=wheelSize/2*0.655,sz=Math.min(wheelSize*(n<=5?0.3:0.275),2*R*Math.sin(Math.PI/n)*1.0);
  letterEls=[];centers=[];
  order.forEach((ch,i)=>{
    const a=-Math.PI/2+i*2*Math.PI/n,x=wheelSize/2+R*Math.cos(a),y=wheelSize/2+R*Math.sin(a);
    const el=document.createElement('div');el.className='letter';const sp=document.createElement('span');sp.textContent=ch;el.appendChild(sp);
    el.style.cssText=`left:${x}px;top:${y}px;width:${sz}px;height:${sz}px;font-size:${sz*.52}px`;
    wheel.appendChild(el);letterEls.push(el);centers.push({x,y,r:sz/2});
  });
  lines.setAttribute('viewBox',`0 0 ${wheelSize} ${wheelSize}`);
  applyWheelGlow();
}
// hinted shells glow on the wheel (tracked by letter, so they survive a shuffle)
function applyWheelGlow(){
  letterEls.forEach(e=>{e.classList.remove('hinted');delete e.dataset.n});
  const used=new Set();
  hintChars.forEach((ch,k)=>{const i=order.findIndex((c,j)=>c===ch&&!used.has(j));if(i>=0){used.add(i);letterEls[i].classList.add('hinted');letterEls[i].dataset.n=k+1}});
}
function renderBonus(newWord){
  const el=$('bonusList');if(!grid)return;
  const sq=Array.from({length:METER_MAX},(_,i)=>`<i class="${i<meter?'on':''}"></i>`).join('');
  const got=[...bonusFound].sort((a,b)=>a.length-b.length||a.localeCompare(b));
  el.innerHTML=`<span class="meter" id="meter" title="Every ${METER_MAX} bonus words earns ${METER_REWARD} sand dollars"><span>Bonus</span><span class="sq">${sq}</span><b>${meter}/${METER_MAX}</b></span>`+(got.length
    ?got.map(w=>`<span class="chip${w===newWord?' new':''}">${w}</span>`).join('')
    :'<span class="chip blank">Any real word earns bonus points</span>');
}
function updateHud(newWord){
  $('coins').textContent=coins;$('score').textContent=score.toLocaleString();$('bonusCount').textContent=bonusFound.size;
  store.set('coins',coins);store.set('score',score);store.set('meter',meter);renderBonus(newWord);
}

// ---------- sound ----------
const Sound=(()=>{
  let ctx=null,master,sfx,muted=store.get('muted',false);
  function init(){
    if(ctx){if(ctx.state==='suspended')ctx.resume();return}
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    try{ctx=new AC()}catch(e){return}
    master=ctx.createGain();master.gain.value=muted?0:1;master.connect(ctx.destination);
    sfx=ctx.createGain();sfx.gain.value=.45;sfx.connect(master);
    waves();music();
  }
  function noise(sec,brown){
    const b=ctx.createBuffer(1,Math.floor(ctx.sampleRate*sec),ctx.sampleRate),d=b.getChannelData(0);let last=0;
    for(let i=0;i<d.length;i++){const w=Math.random()*2-1;if(brown){last=(last+.02*w)/1.02;d[i]=last*3.5}else d[i]=w}
    const fade=Math.floor(ctx.sampleRate*.05);for(let i=0;i<fade;i++){const k=i/fade;d[i]*=k;d[d.length-1-i]*=k}
    return b;
  }
  function waves(){return;/*no background sea sounds*/
    // calm shore: a low steady bed, plus individual waves that roll in, break softly and wash back, panned around
    const amb=ctx.createGain();amb.gain.value=.5;amb.connect(master);
    const bedBuf=noise(8,true),washBuf=noise(6,false);
    const bed=ctx.createBufferSource();bed.buffer=bedBuf;bed.loop=true;
    const blp=ctx.createBiquadFilter();blp.type='lowpass';blp.frequency.value=380;
    const bg=ctx.createGain();bg.gain.value=.05;bed.connect(blp);blp.connect(bg);bg.connect(amb);bed.start();
    function wave(){
      const t=ctx.currentTime+.05,dur=7+Math.random()*3,peak=.12+Math.random()*.08;
      const src=ctx.createBufferSource();src.buffer=washBuf;src.loop=true;
      const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.Q.value=.4;
      lp.frequency.setValueAtTime(260,t);lp.frequency.linearRampToValueAtTime(1100+Math.random()*500,t+dur*.38);
      lp.frequency.exponentialRampToValueAtTime(2600,t+dur*.48);lp.frequency.exponentialRampToValueAtTime(500,t+dur);
      const g=ctx.createGain();g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(peak*.35,t+dur*.3);g.gain.linearRampToValueAtTime(peak,t+dur*.45);
      g.gain.linearRampToValueAtTime(peak*.45,t+dur*.6);g.gain.exponentialRampToValueAtTime(.0005,t+dur);
      let out=g;
      if(ctx.createStereoPanner){const pn=ctx.createStereoPanner();pn.pan.setValueAtTime(Math.random()*1.2-.6,t);pn.pan.linearRampToValueAtTime(Math.random()*1.2-.6,t+dur);g.connect(pn);out=pn}
      src.connect(lp);lp.connect(g);out.connect(amb);
      src.start(t,Math.random()*4);src.stop(t+dur+.1);
      setTimeout(wave,(dur*.62+Math.random()*1.8)*1000);
    }
    wave();
  }
  function music(){
    // soft, slow beach pads with sparse marimba notes in C major pentatonic
    const mus=ctx.createGain();mus.gain.value=.5;mus.connect(master);
    const chords=[[261.6,329.6,392,493.9],[220,261.6,329.6,392],[174.6,220,261.6,329.6],[196,246.9,293.7,392]];
    const scale=[523.3,587.3,659.3,784,880,1046.5];
    let bar=0;
    function pad(f,t,len){
      const o=ctx.createOscillator(),o2=ctx.createOscillator(),g=ctx.createGain(),lp=ctx.createBiquadFilter();
      o.type='sine';o2.type='triangle';o.frequency.value=f;o2.frequency.value=f*1.003;
      lp.type='lowpass';lp.frequency.value=900;
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.022,t+1.6);g.gain.setValueAtTime(.022,t+len-1.8);g.gain.linearRampToValueAtTime(0,t+len);
      o.connect(lp);o2.connect(lp);lp.connect(g);g.connect(mus);o.start(t);o2.start(t);o.stop(t+len+.1);o2.stop(t+len+.1);
    }
    function mallet(f,t){
      const o=ctx.createOscillator(),o2=ctx.createOscillator(),g=ctx.createGain();
      o.type='sine';o2.type='sine';o.frequency.value=f;o2.frequency.value=f*4;
      const g2=ctx.createGain();g2.gain.value=.15;
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.05,t+.01);g.gain.exponentialRampToValueAtTime(.0005,t+1.4);
      o.connect(g);o2.connect(g2);g2.connect(g);g.connect(mus);o.start(t);o2.start(t);o.stop(t+1.5);o2.stop(t+1.5);
    }
    (function next(){
      const t=ctx.currentTime+.1,len=6.4,ch=chords[bar%chords.length];
      ch.forEach(f=>pad(f,t,len+1.2));
      const notes=2+Math.floor(Math.random()*3);
      for(let i=0;i<notes;i++){mallet(scale[Math.floor(Math.random()*scale.length)],t+.8+i*(len/notes)+Math.random()*.4)}
      bar++;setTimeout(next,len*1000);
    })();
  }
  function tone(f,dur,type='sine',vol=.3,delay=0,to=null){
    if(!ctx||muted)return;
    const t=ctx.currentTime+delay,o=ctx.createOscillator(),g=ctx.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+dur);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(sfx);o.start(t);o.stop(t+dur+.05);
  }
  const api={
    init,
    tick:n=>{const f=392*Math.pow(2,[0,2,4,7,9,12,14,16][Math.min(n-1,7)]/12);tone(f,.16,'sine',.26);tone(f*4,.06,'sine',.04)},
    untick:n=>tone(392*Math.pow(2,[0,2,4,7,9,12,14,16][Math.min(n,7)]/12)*.75,.1,'sine',.14),
    plink:(i,d)=>{const f=659*Math.pow(2,[0,2,4,7,9,12,14,16][Math.min(i,7)]/12);tone(f,.2,'triangle',.12,d);tone(f*2,.08,'sine',.04,d)},
    tap:()=>tone(700,.07,'sine',.14),
    good:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.28,'triangle',.25,i*.07)),
    bonus:()=>[1319,1568,2093,2637].forEach((f,i)=>tone(f,.22,'sine',.16,i*.06)),
    bad:()=>tone(240,.3,'triangle',.25,0,130),
    dup:()=>tone(330,.18,'sine',.18),
    clue:()=>[880,1175,1480,1760].forEach((f,i)=>tone(f,.45,'sine',.12,i*.09)),
    swish:()=>tone(260,.22,'sine',.15,0,720),
    win:()=>{[523,659,784,1047,1319].forEach((f,i)=>tone(f,.35,'triangle',.25,i*.1));[523,659,784].forEach(f=>tone(f,.9,'sine',.12,.55))},
    long:()=>{[523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,.3,'triangle',.22,i*.055));tone(2093,.5,'sine',.08,.36);tone(2637,.4,'sine',.05,.42)},
    combo:n=>{const f=[0,523,587,659,784,880][Math.min(5,n)]*2;tone(f,.16,'sine',.16);tone(f*1.5,.14,'sine',.07,.06);if(n>=4)tone(f*2,.2,'sine',.05,.12)},
    meter:()=>[784,988,1175,1568,1976].forEach((f,i)=>tone(f,.26,'triangle',.18,i*.07)),
    get muted(){return muted},
    toggle(){muted=!muted;store.set('muted',muted);if(master)master.gain.setTargetAtTime(muted?0:1,ctx.currentTime,.05);paintMute()}
  };
  return api;
})();

// ---------- input ----------
let path=[],dragging=false,pointer=null;
function hit(x,y){for(let i=0;i<centers.length;i++){const c=centers[i];if(Math.hypot(x-c.x,y-c.y)<c.r*1.15)return i}return -1}
function local(e){const r=wheel.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function addIdx(i){
  if(i<0)return;
  if(path.length>1&&path[path.length-2]===i){letterEls[path.pop()].classList.remove('on','bounce');Sound.untick(path.length);buzz(6)}
  else if(!path.includes(i)){path.push(i);const L_=letterEls[i];L_.classList.add('on');L_.classList.remove('bounce');L_.style.animationDelay='0ms';void L_.offsetWidth;L_.classList.add('bounce');Sound.tick(path.length);buzz(12)}
  showPreview();
}
function showPreview(){const w=path.map(i=>order[i]).join('');preview.className=w?'':'empty';preview.textContent=w}
function drawLines(){
  let s='';const pts=path.map(i=>centers[i]);
  if(pts.length){let d='M'+pts.map(p=>p.x+' '+p.y).join(' L');if(pointer&&dragging)d+=' L'+pointer.x+' '+pointer.y;
    s=`<path d="${d}" fill="none" stroke="#d9661a" stroke-width="${wheelSize*.03}" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>`}
  lines.innerHTML=s;
}
wheel.addEventListener('pointerdown',e=>{if(!$('overlay').hidden)return;e.preventDefault();dragging=true;try{wheel.setPointerCapture(e.pointerId)}catch(_){}pointer=local(e);addIdx(hit(pointer.x,pointer.y));drawLines()});
wheel.addEventListener('pointermove',e=>{if(!dragging)return;pointer=local(e);addIdx(hit(pointer.x,pointer.y));drawLines()});
const end=()=>{if(!dragging)return;dragging=false;submit(path.map(i=>order[i]).join(''));letterEls.forEach(l=>l.classList.remove('on'));path=[];drawLines()};
wheel.addEventListener('pointerup',end);wheel.addEventListener('pointercancel',end);
wheel.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});

function flash(cls){preview.classList.remove('bad','good','bonus','snap');void preview.offsetWidth;preview.classList.add(cls);if(cls!=='bad'&&!RM)preview.classList.add('snap');
  clearTimeout(flash.t);flash.t=setTimeout(()=>{preview.className='empty'},cls==='bad'?400:700)}

// ---------- juice: floating labels, flying letters and points, splash ----------
function rectOf(el){return el.getBoundingClientRect()}
function floatLabel(text,sub,cls){
  // word praise floats in the open strip between the board and the bonus meter; NEW BEST sits over the board
  const tag=rectOf($('levelTag')),bl=rectOf($('bonusList')),bd=rectOf(boardEl),el=document.createElement('div');
  el.className='floatlbl '+(cls||'');el.innerHTML=`<b>${text}</b>${sub?`<span>${sub}</span>`:''}`;
  const x=bd.left+bd.width/2,y=cls==='best'?bd.top+bd.height*.3:Math.max(tag.bottom+46,bl.top-4);
  el.style.left=x+'px';el.style.top=y+'px';document.body.appendChild(el);
  setTimeout(()=>el.remove(),RM?900:1250);
}
function flyPoints(pts,fromRect){
  const target=$('scorePill');
  const done=()=>{target.classList.remove('bump');void target.offsetWidth;target.classList.add('bump');countScore()};
  if(RM||!fromRect){done();return}
  const tr=rectOf(target),el=document.createElement('div');el.className='flypts';el.textContent='+'+pts;
  const sx=fromRect.left+fromRect.width/2,sy=fromRect.top;el.style.left=sx+'px';el.style.top=sy+'px';document.body.appendChild(el);
  const a=el.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:`translate(calc(${tr.left+tr.width/2-sx}px - 50%),calc(${tr.top+tr.height/2-sy}px - 50%)) scale(.6)`,opacity:.9}],
    {duration:560,delay:180,easing:'cubic-bezier(.5,0,.75,0)',fill:'forwards'});

}
let shownScore=score;
function countScore(){const el=$('score'),from=shownScore,to=score,t0=performance.now(),d=RM?0:380;shownScore=to;
  (function step(t){const k=d?Math.min(1,(t-t0)/d):1;el.textContent=Math.round(from+(to-from)*k).toLocaleString();if(k<1)requestAnimationFrame(step)})(t0)}
function flyLetters(word,p,after){
  if(RM){after();return}
  const pr=rectOf(preview),cells=cellsOf(p),n=word.length,step=(pr.width-24)/n;let left=n;
  cells.forEach((x,i)=>{
    const cell=boardEl.querySelector(`.cell[data-k="${x.k}"]`);if(!cell){if(--left===0)after();return}

    document.body.appendChild(el);

      {duration:380,delay:120+i*45,easing:'cubic-bezier(.3,.7,.35,1)',fill:'forwards'});

function splash(){if(RM)return;const r=rectOf($('board')),el=document.createElement('div');el.className='splash';
  el.style.left=(r.left+r.width/2)+'px';el.style.top=(r.top+r.height/2)+'px';document.body.appendChild(el);setTimeout(()=>el.remove(),900);

// ---------- Advanced timer (pauses while a card is open or the tab is hidden) ----------
function fmt(t){t=Math.max(0,Math.ceil(t));return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')}
function paintTimer(){if(!mode.timer)return;$('timeLeft').textContent=fmt(timeLeft);$('timer').classList.toggle('low',timeLeft<=30)}
let savedAt=0;
function timerLoop(now){
  const dt=(now-lastTick)/1000;lastTick=now;
  if(timerOn&&mode.timer&&!timedOut&&$('overlay').hidden&&!document.hidden&&grid&&!grid.words.every(p=>found.has(p.w))){
    const before=Math.ceil(timeLeft);timeLeft-=Math.min(dt,.25);
    if(Math.ceil(timeLeft)!==before){paintTimer();if(timeLeft<=10&&timeLeft>0)Sound.tap();if(now-savedAt>3000){savedAt=now;saveLevelState()}}
    if(timeLeft<=0){timeLeft=0;paintTimer();timeUp()}
  }
  requestAnimationFrame(timerLoop);
}
requestAnimationFrame(t=>{lastTick=t;requestAnimationFrame(timerLoop)});
function addTime(sec){timeLeft+=sec;paintTimer();const el=$('timer');el.classList.remove('plus');void el.offsetWidth;el.classList.add('plus')}
const MORE_TIME=60,MORE_TIME_COST=20;
function timeUp(){
  timedOut=true;saveLevelState();Sound.bad();buzz([60,40,60]);
  const left=grid.words.filter(p=>!found.has(p.w)).length;
  showCard(`<h2>Time's up!</h2><p>${left} word${left===1?'':'s'} still hiding in the grid.</p>
    <div class="row2"><button class="big" id="moreBtn">+${MORE_TIME}s for ${MORE_TIME_COST}</button>
    <button class="big alt" id="retryBtn">Try again</button></div>`);
  $('moreBtn').onclick=()=>{if(coins<MORE_TIME_COST){toast(`Need ${MORE_TIME_COST} sand dollars`);return}
    coins-=MORE_TIME_COST;updateHud();timedOut=false;hideCard();addTime(MORE_TIME);lastTick=performance.now();saveLevelState();Sound.clue()};
  $('retryBtn').onclick=()=>{hideCard();store.set(progKey(null,'lvl'),null);startLevel(levelIdx)};
}

    return `<button class="mode ${k}${k===mode.key?' cur':''}" data-mode="${k}"><span class="lv">${[0,1,2].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</span>

  if(b.dataset.mode!==mode.key)setMode(b.dataset.mode);else{lastTick=performance.now()}store.set('pickedMode',true);if(after)after()})}

// ---------- combo ----------
function bumpCombo(){
  const now=performance.now();combo=now<comboUntil?combo+1:1;comboUntil=now+COMBO_MS;
  if(combo>bestCombo)bestCombo=combo;
  const b=$('comboBadge');
  if(combo>=2){const m=Math.min(COMBO_CAP,combo);b.hidden=false;b.className='combo-badge lv'+m;$('comboX').textContent=m+'X';
    b.classList.remove('pulse');void b.offsetWidth;b.classList.add('pulse');if(!bumpCombo.raf)tickCombo();
    if(m>=4)$('app').classList.add('surge')}
  return Math.min(COMBO_CAP,combo);
}
function tickCombo(){const left=comboUntil-performance.now();
  if(left<=0){combo=0;$('comboBadge').hidden=true;$('app').classList.remove('surge');bumpCombo.raf=0;return}
  $('comboBar').style.transform=`scaleX(${left/COMBO_MS})`;bumpCombo.raf=requestAnimationFrame(tickCombo)}

// ---------- personal bests ----------
function checkRecord(key,val,better,label){
  if(!better)return false;const had=!!recs[key];recs[key]=val;store.set('records',recs);
  if(had&&!recShown.has(key)){recShown.add(key);return label}
  return '';
}

// ---------- word submission ----------
// Three outcomes: a crossword (target) word, any other real word (Bonus Word), or not a word.
function submit(raw){
  const w=String(raw||'').toUpperCase();
  if(w.length<3){preview.className='empty';return}
  if(timedOut)return;
  if(w.length<mode.minLen){flash('bad');Sound.dup();toast(`Words need ${mode.minLen}+ letters here`);return}
  const gw=grid.words.find(p=>p.w===w);
  if(gw){
    if(found.has(w)){flash('bad');Sound.dup();toast('Already found');return}   // can't score twice
    found.add(w);
    if(hint.word===w){hint={word:null,stage:0};hintChars=[];applyWheelGlow()}
    const pts=award(w,WORD_PTS,'target');
    if(mode.timer&&mode.timeBonus)addTime(mode.timeBonus);
    flash('good');buzz([18,40,18]);
    flyLetters(w,gw,()=>{refreshCells(gw);boardEl.classList.remove('bump');void boardEl.offsetWidth;boardEl.classList.add('bump')});
    saveLevelState();
    if(grid.words.every(p=>found.has(p.w)))setTimeout(win,RM?600:1100);
    return pts;
  }
  if(isWord(w)){
    if(bonusFound.has(w)){flash('bad');Sound.dup();toast('Already in your bonus words');return}  // no farming
    bonusFound.add(w);
    award(w,BONUS_PTS,'bonus');
    flash('bonus');buzz([12,30,12]);
    let fill=1+(w.length>=5?1:0)+(w.length>=7?1:0);meter+=fill;
    if(meter>=METER_MAX){meter-=METER_MAX;coins+=METER_REWARD;setTimeout(()=>{Sound.meter();toast(`Bonus meter full! +${METER_REWARD} sand dollars`);buzz([20,40,20,40,20])},500)}
    updateHud(w);saveLevelState();
    const m=$('meter');if(m&&!RM){m.classList.remove('fill');void m.offsetWidth;m.classList.add('fill')}
    return;
  }
  // not a word: gentle feedback, combo survives, try again right away
  flash('bad');Sound.bad();buzz([30,30,30]);wheel.classList.remove('shake');void wheel.offsetWidth;wheel.classList.add('shake');toast('Not a word');
  misses++;
  if(mode.clueAt&&misses>=mode.clueAt){misses=0;giveClue()}
}
function award(w,table,kind){
  misses=0;
  const n=Math.min(8,w.length),mult=bumpCombo(),pts=Math.round(table[n]*mult*mode.mult),from=rectOf(preview);
  score+=pts;levelScore+=pts;
  if(w.length>longest.length)longest=w;
  updateHud(kind==='bonus'?w:undefined);
  // headline: long-word praise wins, then combo call-outs; bonus words always say so
  const longLbl=w.length>=5?LONG_LABEL[n]:'';
  const comboLbl=mult>=2?`${COMBO_LABEL[mult]} ${mult}X`:'';
  if(kind==='bonus')floatLabel('BONUS WORD!',`+${pts}${comboLbl?' · '+mult+'X':''}`,'bonus');
  else floatLabel(longLbl||(mult>=2?COMBO_LABEL[mult]:COMBO_LABEL[1]),`+${pts}${mult>=2?' · '+mult+'X':''}`,w.length>=7?'huge':w.length>=5?'long':'');
  if(w.length>=6)Sound.long();else if(kind==='bonus')Sound.bonus();else Sound.good();
  if(mult>=2)setTimeout(()=>Sound.combo(mult),180);
  if(w.length>=7||mult>=COMBO_CAP)splash();
  flyPoints(pts,from);
  const bests=[checkRecord('longest',w,w.length>(recs.longest||'').length,'Longest word: '+w),
    checkRecord('combo',combo,combo>=2&&combo>recs.combo,'Best combo: '+Math.min(COMBO_CAP,combo)+'X'),
    checkRecord('wordScore',pts,pts>recs.wordScore,'Highest word score: '+pts)].filter(Boolean);
  if(bests.length)setTimeout(()=>floatLabel('NEW BEST!',bests[0],'best'),650);   // one call-out per word
  return pts;
}
function giveClue(){
  const shownNow=new Set();grid.words.forEach(p=>{if(found.has(p.w))cellsOf(p).forEach(x=>shownNow.add(x.k))});
  const options=grid.words.filter(p=>!found.has(p.w)&&cellsOf(p).slice(0,2).some(x=>!shownNow.has(x.k)&&!glow.has(x.k)));
  if(!options.length)return;
  const pick=options[Math.floor(Math.random()*options.length)];
  cellsOf(pick).slice(0,2).forEach(x=>{if(!shownNow.has(x.k)){revealed.add(x.k);glow.add(x.k)}});
  refreshCells(false);saveLevelState();setTimeout(()=>{Sound.clue();toast('Clue: look for the glowing letters')},450);
}

// ---------- level complete ----------
function win(){
  timerOn=false;
  const reward=Math.round((10+grid.words.length*2)*mode.mult);coins+=reward;
  const stars=hintsUsed===0?3:hintsUsed<=2?2:1;
  const newLevelBest=recs.levelScore>0&&levelScore>recs.levelScore,newBonusBest=recs.bonusLevel>0&&bonusFound.size>recs.bonusLevel;
  if(levelScore>recs.levelScore)recs.levelScore=levelScore;if(bonusFound.size>recs.bonusLevel)recs.bonusLevel=bonusFound.size;
  store.set('records',recs);
  updateHud();Sound.win();buzz([30,60,30,60,80]);splash();
  const last=levelIdx===LV.length-1,nextMode=MODE_ORDER[MODE_ORDER.indexOf(mode.key)+1];
  const nb='<em class="nb">NEW BEST</em>';
  showCard(`<div class="stars" aria-label="${stars} of 3 stars">${[1,2,3].map(i=>`<span class="${i<=stars?'on':''}" style="animation-delay:${i*120}ms">★</span>`).join('')}</div>
    <h2>${last?'You cleared the coast!':'Level complete!'}</h2>
    <div class="lvscore">${levelScore.toLocaleString()}${newLevelBest?nb:''}</div>
    <div class="stats">
      <div><small>Longest word</small><b>${longest||'–'}</b></div>
      <div><small>Bonus words</small><b>${bonusFound.size}${newBonusBest?nb:''}</b></div>
      <div><small>Best combo</small><b>${bestCombo>=2?Math.min(COMBO_CAP,bestCombo)+'X':'–'}</b></div>
      <div><small>Sand dollars</small><b>+${reward}</b></div>${mode.timer?`<div><small>Time left</small><b>${fmt(timeLeft)}</b></div><div><small>Difficulty</small><b>${mode.label}</b></div>`:''}
    </div>
    <p class="small">${stars===3?'No hints used. Perfect!':`Hints used: ${hintsUsed}. Solve without hints for 3 stars.`}</p>
    <div class="row2"><button class="big" id="nextBtn">${last?'Play again':'Next level'}</button>${last&&nextMode?`<button class="big alt" id="upBtn">Try ${MODES[nextMode].label}</button>`:''}</div>`);
  const nextI=last?0:levelIdx+1;store.set(progKey(null,'level'),nextI);store.set(progKey(null,'lvl'),null);
  window.BDA&&BDA.shareScore({score:levelScore,line:mode.label+' · Level '+(levelIdx+1),into:'#card',after:'.lvscore'});
  $('nextBtn').onclick=()=>{hideCard();startLevel(nextI)};
  if($('upBtn'))$('upBtn').onclick=()=>{hideCard();setMode(nextMode)};
  $('nextBtn').focus();
}
function showCard(html){$('card').innerHTML=html;$('overlay').hidden=false}
function hideCard(){$('overlay').hidden=true}
$('overlay').addEventListener('click',e=>{if(e.target.id==='overlay'&&!e.target.querySelector('#nextBtn,#retryBtn,.mode'))hideCard()});

// ---------- tutorial tips (one line each, first four levels, shown once) ----------
const TIPS=['Drag across the shells to spell a word.','Real words that aren’t in the grid still earn Bonus points!','Find words quickly to build a Combo!','Longer words earn bigger rewards!'];
const MODE_TIP={int:'Intermediate: bigger wheels and bigger grids. Points ×1.5!',adv:'Advanced: words need 4+ letters, and the clock is ticking. Points ×2!'};
function showTip(){
  if(mode.key!=='beg'){if(store.get('tip'+mode.suffix,false))return;
    if(!$('overlay').hidden){clearTimeout(showTip.w);showTip.w=setTimeout(showTip,400);return}
    const el=$('tip');el.textContent=MODE_TIP[mode.key];el.hidden=false;store.set('tip'+mode.suffix,true);
    clearTimeout(showTip.t);showTip.t=setTimeout(()=>el.hidden=true,5200);return}
  const seen=store.get('tips',0);if(levelIdx>=TIPS.length||levelIdx<seen)return;
  if(!$('overlay').hidden){clearTimeout(showTip.w);showTip.w=setTimeout(showTip,400);return}
  const el=$('tip');el.textContent=TIPS[levelIdx];el.hidden=false;store.set('tips',levelIdx+1);
  clearTimeout(showTip.t);showTip.t=setTimeout(()=>el.hidden=true,5200)}

// ---------- buttons ----------
$('shuffleBtn').onclick=()=>{order=shuffle(order);renderWheel();Sound.swish();buzz(10);letterEls.forEach((l,i)=>{l.style.animationDelay=(i*40)+'ms';l.classList.add('bounce')})};
// Smart hint: 1) light up a starting shell, 2) light up the next shell, 3+) show the word's first letters in the grid.
$('hintBtn').onclick=()=>{Sound.tap();buzz(8);
  if(coins<HINT_COST){toast(`Need ${HINT_COST} sand dollars`);return}
  let p=hint.word&&!found.has(hint.word)?grid.words.find(x=>x.w===hint.word):null;
  if(!p){const open=grid.words.filter(x=>!found.has(x.w)).sort((a,b)=>a.w.length-b.w.length);if(!open.length)return;p=open[0];hint={word:p.w,stage:0};hintChars=[]}
  const filled=new Set();grid.words.forEach(q=>{if(found.has(q.w))cellsOf(q).forEach(x=>filled.add(x.k))});
  let msg='';
  if(hint.stage<2){hintChars.push(p.w[hint.stage]);applyWheelGlow();msg=hint.stage===0?'Start with the glowing shell':'Then this glowing shell';
    letterEls.filter(l=>l.classList.contains('hinted')).forEach(l=>{l.classList.remove('bounce');void l.offsetWidth;l.classList.add('bounce')})}
  else{const next=cellsOf(p).find(x=>!revealed.has(x.k)&&!filled.has(x.k));
    if(!next){hint={word:null,stage:0};hintChars=[];applyWheelGlow();$('hintBtn').onclick();return}
    revealed.add(next.k);glow.add(next.k);refreshCells(false);msg='Here’s how it starts'}
  hint.stage++;coins-=HINT_COST;hintsUsed++;updateHud();saveLevelState();Sound.clue();toast(msg);
};
$('bonusBtn').onclick=()=>{Sound.tap();buzz(8);
  const list=[...bonusFound];
  const rec=[['Longest word',recs.longest||'–'],['Best combo',recs.combo>=2?Math.min(COMBO_CAP,recs.combo)+'X':'–'],['Highest word score',recs.wordScore||'–'],
    ['Most bonus words in a level',recs.bonusLevel||'–'],['Best level score',recs.levelScore?recs.levelScore.toLocaleString():'–']];
  showCard(`<h2>Bonus words</h2><p>Any real word that isn't in the grid earns bonus points and fills the Bonus meter. Every ${METER_MAX} earns ${METER_REWARD} sand dollars.</p>
   ${list.length?`<div class="list">${list.map(w=>`<div>${w}</div>`).join('')}</div>`:'<p><i>None yet this level.</i></p>'}
   <h3 class="rech">Your bests</h3><div class="recs">${rec.map(([a,b])=>`<div><span>${a}</span><b>${b}</b></div>`).join('')}</div>
   <button class="big" id="closeBtn">Back to the beach</button>`);
  $('closeBtn').onclick=hideCard;
};
$('restartBtn').onclick=()=>{Sound.tap();buzz(8);
  showCard(`<h2>Difficulty</h2><p class="small">Each difficulty keeps its own level. Sand dollars, score and bests are shared.</p>${modeButtons()}
   <button class="linkbtn" id="overBtn">Start ${mode.label} over from level 1</button>`);
  bindModes();
  $('overBtn').onclick=()=>{showCard(`<h2>Start over?</h2><p>Go back to ${mode.label} level 1. You keep your sand dollars, score and bests.</p>
   <div class="row2"><button class="big" id="yesBtn">Start over</button><button class="big alt" id="noBtn">Keep playing</button></div>`);
   $('yesBtn').onclick=()=>{hideCard();store.set(progKey(null,'lvl'),null);startLevel(0)};$('noBtn').onclick=hideCard};
};

let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{renderBoard();renderWheel()},120)});
startLevel(levelIdx,true);
if(store.get('seenIntro',false)===false){
  showCard(`<h2>Word Workshop</h2><p>Drag across the shells to spell words and fill the grid. Any other real word is a <b>Bonus Word</b>. Pick your difficulty:</p>${modeButtons()}`);
  bindModes(()=>store.set('seenIntro',true));
}else if(!store.get('pickedMode',false)){
  showCard(`<h2>New: difficulty levels!</h2><p>Your Beginner progress is saved. Want a bigger challenge?</p>${modeButtons()}`);
  bindModes();
}
</script>
